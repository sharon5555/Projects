<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Galaxy Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Main container for the entire login experience -->
    <main class="login-page">

        <!-- Decorative galaxy background  -->
        <div class="galaxy">
            <div class="planet"></div>
        </div>

        <!--Login card -->
        <section class="login-card">

            <!-- small futuristic logo -->
            <div class="logo">
                ✦
            </div>

            <!--Welcome heading -->
            <h1>Welcome Back</h1>

            <!--Short description -->
            <p class="subtitle">
                Enter the galaxy and continue your journey.
            </p>

            <!--Login Form -->
            <form id="loginForm">

                <!--Email field -->
                <div class="input-group">
                    <label for="email">Email Address</label>

                    <input
                        type="text"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <!--Password field -->
                <div class="input-group">
                    <label for="password">Password</label>

                    <div class="password-box">

                        <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <!--JavaScript will use this button to show / hide the password-->
                    <button
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        🙈
                    </button>

                    </div>
                    
                </div>

                <!--Remember me and forget password -->
                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>

                    <a href="#">Forget Password?</a>

                </div>

                <!--Login button -->
                <button type="submit" class="login-button">
                    Enter the Galaxy
                </button>

            </form>

            <!--Registration Option -->
            <p class="register-text">
                Don't have an account?
                <a href="#">Create one</a>
            </p>

        </section>

    </main>

    <!--We connect our javascript file-->
    <script src="script.js"></script>

</body>
</html>
