<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on phones and tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Games Gallery</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="neon.css">
</head>

<body>

    <!-- Page heading -->
    <header>
        <h1>🎮 Neon Games Gallery</h1>
        <p>Explore your favorite cartoons and games!</p>
    </header>


    <!-- Gallery container -->
    <section class="gallery">

        <!-- Spider-Man -->
        <div class="game-card">

            <div class="image-box">
                <img src="../IMAGE GALLERY/assets/spidermangame.jpg" alt="Spider-Man">
            </div>

            <div class="game-info">
                <h2>Spider-Man</h2>
                <p>The amazing web-slinging hero!</p>
            </div>

        </div>


        <!-- Sonic -->
        <div class="game-card">

            <div class="image-box">
                <img src="../IMAGE GALLERY/assets/sonic.png" alt="Sonic">
            </div>

            <div class="game-info">
                <h2>Sonic</h2>
                <p>The fastest hedgehog around!</p>
            </div>

        </div>


        <!-- Mario -->
        <div class="game-card">

            <div class="image-box">
                <img src="../IMAGE GALLERY/assets/mario.png" alt="Super Mario">
            </div>

            <div class="game-info">
                <h2>Super Mario</h2>
                <p>The famous mushroom-loving hero!</p>
            </div>

        </div>


        <!-- Minecraft -->
        <div class="game-card">

            <div class="image-box">
                <img src="../IMAGE GALLERY/assets/minecraft.jpg" alt="Minecraft">
            </div>

            <div class="game-info">
                <h2>Minecraft</h2>
                <p>Build, explore and create!</p>
            </div>

        </div>


        <!-- Pokémon -->
        <div class="game-card">

            <div class="image-box">
                <img src="../IMAGE GALLERY/assets/pokemon.jpg" alt="Pokémon">
            </div>

            <div class="game-info">
                <h2>Pokémon</h2>
                <p>Gotta catch them all!</p>
            </div>

        </div>


        <!-- Roblox -->
        <div class="game-card">

            <div class="image-box">
                <img src="../IMAGE GALLERY/assets/roblox.jpg" alt="Roblox">
            </div>

            <div class="game-info">
                <h2>Roblox</h2>
                <p>Create, play and explore!</p>
            </div>

        </div>

    </section>

</body>
</html>
