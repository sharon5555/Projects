<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stacked Travel Gallery</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="stackedbasic.css">
</head>

<body>

    <!-- Page heading -->
    <header>
        <h1>✈️ Dream Travel Gallery</h1>
        <p>Hover over the cards and explore the world!</p>
    </header>


    <!-- Stacked Cards -->
    <section class="stack-container">


        <!-- Maldives -->
        <div class="travel-card card-1">

            <img src="../IMAGE GALLERY/assets/maldives.jpg" alt="Maldives">

            <div class="card-info">
                <h2>Maldives</h2>
                <p>Paradise in the ocean</p>
            </div>

        </div>


        <!-- Paris -->
        <div class="travel-card card-2">

            <img src="../IMAGE GALLERY/assets/paris.jpg" alt="Paris">

            <div class="card-info">
                <h2>Paris</h2>
                <p>The city of lights</p>
            </div>

        </div>


        <!-- Switzerland -->
        <div class="travel-card card-3">

            <img src="../IMAGE GALLERY/assets/swizerland.jpg" alt="Switzerland">

            <div class="card-info">
                <h2>Switzerland</h2>
                <p>Beautiful mountains and snow</p>
            </div>

        </div>


        <!-- Dubai -->
        <div class="travel-card card-4">

            <img src="../IMAGE GALLERY/assets/dubia.jpg" alt="Dubai">

            <div class="card-info">
                <h2>Dubai</h2>
                <p>A city of amazing buildings</p>
            </div>

        </div>


        <!-- Japan -->
        <div class="travel-card card-5">

            <img src="../IMAGE GALLERY/assets/japan.jpg" alt="Japan">

            <div class="card-info">
                <h2>Japan</h2>
                <p>Where tradition meets technology</p>
            </div>

        </div>


        <!-- Rome -->
        <div class="travel-card card-6">

            <img src="../IMAGE GALLERY/assets/rome.jpg" alt="Rome">

            <div class="card-info">
                <h2>Rome</h2>
                <p>A city full of history</p>
            </div>

        </div>

    </section>

</body>
</html>
