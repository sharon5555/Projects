<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the website responsive on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planet Accordion Gallery</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="accordion.css">
</head>

<body>

    <!-- Page heading -->
    <header>
        <h1>🌌 Planet Accordion Gallery</h1>
        <p>Hover over a planet to explore!</p>
    </header>


    <!-- Accordion Gallery -->
    <section class="accordion">

        <!-- Earth -->
        <div class="planet earth">
            <div class="planet-info">
                <h2>Earth</h2>
                <p>Our beautiful home planet</p>
            </div>
        </div>


        <!-- Mars -->
        <div class="planet mars">
            <div class="planet-info">
                <h2>Mars</h2>
                <p>The Red Planet</p>
            </div>
        </div>


        <!-- Jupiter -->
        <div class="planet jupiter">
            <div class="planet-info">
                <h2>Jupiter</h2>
                <p>The largest planet</p>
            </div>
        </div>


        <!-- Saturn -->
        <div class="planet mercury">
            <div class="planet-info">
                <h2>Mercury</h2>
                <p>The Smallest Planet</p>
            </div>
        </div>


        <!-- Neptune -->
        <div class="planet venus">
            <div class="planet-info">
                <h2>Venus</h2>
                <p>The Hottest Planet</p>
            </div>
        </div>

    </section>

</body>
</html>
