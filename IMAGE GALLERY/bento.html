<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- Makes the page work properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bento Nature Gallery</title>

    <!-- Connect our CSS file -->
    <link rel="stylesheet" href="bento.css">

</head>


<body>


    <!-- =========================
         PAGE HEADER
    ========================== -->

    <header class="header">

        <p class="small-title">
            EXPLORE NATURE
        </p>

        <h1>
            Nature Bento Gallery
        </h1>

        <p>
            Beautiful places captured around the world.
        </p>

    </header>


    <!-- =========================
         BENTO GALLERY
    ========================== -->

    <main class="bento-gallery">


        <!-- =========================
             CARD 1 - MOUNTAINS
        ========================== -->

        <article class="bento-card mountains">

            <img
                src="../IMAGE GALLERY/assets/n7.jpeg"
                alt="Beautiful mountains"
            >

            <div class="overlay">

                <span>01</span>

                <h2>Mountains</h2>

                <p>
                    Reach for the sky.
                </p>

            </div>

        </article>


        <!-- =========================
             CARD 2 - FOREST
        ========================== -->

        <article class="bento-card forest">

            <img
                src="../IMAGE GALLERY/assets/forest.jpeg"
                alt="Green forest"
            >

            <div class="overlay">

                <span>02</span>

                <h2>Forest</h2>

                <p>
                    Walk into nature.
                </p>

            </div>

        </article>


        <!-- =========================
             CARD 3 - LAKE
        ========================== -->

        <article class="bento-card lake">

            <img
                src="../IMAGE GALLERY/assets/lake.jpg"
                alt="Beautiful lake"
            >

            <div class="overlay">

                <span>03</span>

                <h2>Lake</h2>

                <p>
                    Calm waters.
                </p>

            </div>

        </article>


        <!-- =========================
             CARD 4 - WATERFALL
        ========================== -->

        <article class="bento-card waterfall">

            <img
                src="../IMAGE GALLERY/assets/waterfall.jpeg"
                alt="Beautiful waterfall"
            >

            <div class="overlay">

                <span>04</span>

                <h2>Waterfall</h2>

                <p>
                    Feel the power of water.
                </p>

            </div>

        </article>


        <!-- =========================
             CARD 5 - DESERT
        ========================== -->

        <article class="bento-card desert">

            <img
                src="../IMAGE GALLERY/assets/desert.jpeg"
                alt="Beautiful desert"
            >

            <div class="overlay">

                <span>05</span>

                <h2>Desert</h2>

                <p>
                    Endless golden sand.
                </p>

            </div>

        </article>


        <!-- =========================
             CARD 6 - OCEAN
        ========================== -->

        <article class="bento-card ocean">

            <img
                src="../IMAGE GALLERY/assets/ocean.jpeg"
                alt="Beautiful ocean"
            >

            <div class="overlay">

                <span>06</span>

                <h2>Ocean</h2>

                <p>
                    Discover the blue.
                </p>

            </div>

        </article>


    </main>


</body>

</html>
