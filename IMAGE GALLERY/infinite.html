<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on phones and tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Infinite Marquee Gallery</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="infinite.css">
</head>

<body>

    <!-- Page heading -->
    <header>
        <h1>🎮 Infinite Games Gallery</h1>
        <p>Watch the characters move forever!</p>
    </header>


    <!-- Main marquee area -->
    <section class="marquee">

        <!--
            The track is the long row that moves.
            We duplicate the cards so the animation
            can continue smoothly without stopping.
        -->
        <div class="marquee-track">

            <!-- =====================
                FIRST SET OF CARDS
            ====================== -->

            <div class="game-card">
                <img src="../IMAGE GALLERY/assets/sonic.png" alt="Sonic">
                <h2>Sonic</h2>
            </div>

            <div class="game-card">
                <img src="../IMAGE GALLERY/assets/mario.png" alt="Super Mario">
                <h2>Super Mario</h2>
            </div>

            <div class="game-card">
                <img src="../IMAGE GALLERY/assets/minecraft.jpg" alt="Minecraft">
                <h2>Minecraft</h2>
            </div>

            <div class="game-card">
                <img src="../IMAGE GALLERY/assets/pikachu.jpeg" alt="Pikachu">
                <h2>Pikachu</h2>
            </div>

            <div class="game-card">
                <img src="../IMAGE GALLERY/assets/roblox.jpg" alt="Roblox">
                <h2>Roblox</h2>
            </div>

            <div class="game-card">
                <img src="../IMAGE GALLERY/assets/spidermangame.jpg" alt="Spider-Man">
                <h2>Spider-Man</h2>
            </div>


            <!-- =====================
                DUPLICATE SET
                This creates the
                continuous effect.
            ====================== -->

            <div class="game-card">
                <img src="../IMAGE GALLERY/assets/sonic.png" alt="Sonic">
                <h2>Sonic</h2>
            </div>

            <div class="game-card">
                <img src="../IMAGE GALLERY/assets/mario.png" alt="Super Mario">
                <h2>Super Mario</h2>
            </div>

            <div class="game-card">
                <img src="../IMAGE GALLERY/assets/minecraft.jpg" alt="Minecraft">
                <h2>Minecraft</h2>
            </div>

            <div class="game-card">
                <img src="../IMAGE GALLERY/assets/pikachu.jpeg" alt="Pikachu">
                <h2>Pikachu</h2>
            </div>

            <div class="game-card">
                <img src="../IMAGE GALLERY/assets/roblox.jpg" alt="Roblox">
                <h2>Roblox</h2>
            </div>

            <div class="game-card">
                <img src="../IMAGE GALLERY/assets/spidermangame.jpg" alt="Spider-Man">
                <h2>Spider-Man</h2>
            </div>

        </div>

    </section>


    <!-- Small instruction -->
    <p class="instruction">
        Hover over the gallery to pause the animation ⏸️
    </p>

</body>
</html>
