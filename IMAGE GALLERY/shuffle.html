<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- Makes the page responsive -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Shuffle Gallery</title>

    <!-- Connect CSS -->
    <link rel="stylesheet" href="shuffle.css">

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <p class="small-title">
            MIX • MOVE • DISCOVER
        </p>

        <h1>
            🔀 Shuffle Gallery
        </h1>

        <p>
            Click the button and watch the cards find new places.
        </p>


        <!-- Shuffle Button -->

        <button
            class="shuffle-btn"
            id="shuffleBtn"
        >
            🔀 Shuffle
        </button>

    </header>



    <!-- =========================
         GALLERY
    ========================== -->

    <main class="gallery" id="gallery">


        <!-- CARD 1 -->

        <article class="gallery-card">

            <img
                src="../IMAGE GALLERY/assets/strawberry.jpeg"
                alt="Strawberry"
            >

            <div class="card-info">

                <span>01</span>

                <h2>Strawberry</h2>

                <p>
                    Sweet and colorful.
                </p>

            </div>

        </article>



        <!-- CARD 2 -->

        <article class="gallery-card">

            <img
                src="../IMAGE GALLERY/assets/orange.jpg"
                alt="Orange"
            >

            <div class="card-info">

                <span>02</span>

                <h2>Orange</h2>

                <p>
                    Bright and juicy.
                </p>

            </div>

        </article>



        <!-- CARD 3 -->

        <article class="gallery-card">

            <img
                src="../IMAGE GALLERY/assets/watermelon.jpeg"
                alt="Watermelon"
            >

            <div class="card-info">

                <span>03</span>

                <h2>Watermelon</h2>

                <p>
                    Cool and refreshing.
                </p>

            </div>

        </article>



        <!-- CARD 4 -->

        <article class="gallery-card">

            <img
                src="../IMAGE GALLERY/assets/banana.jpeg"
                alt="Banana"
            >

            <div class="card-info">

                <span>04</span>

                <h2>Banana</h2>

                <p>
                    Soft and delicious.
                </p>

            </div>

        </article>



        <!-- CARD 5 -->

        <article class="gallery-card">

            <img
                src="../IMAGE GALLERY/assets/grapes.jpeg"
                alt="Grapes"
            >

            <div class="card-info">

                <span>05</span>

                <h2>Grapes</h2>

                <p>
                    Small but tasty.
                </p>

            </div>

        </article>



        <!-- CARD 6 -->

        <article class="gallery-card">

            <img
                src="../IMAGE GALLERY/assets/kiwi.jpeg"
                alt="Kiwi"
            >

            <div class="card-info">

                <span>06</span>

                <h2>Kiwi</h2>

                <p>
                    Fresh and healthy.
                </p>

            </div>

        </article>


    </main>



    <!-- Connect JavaScript -->
    <script src="shuffle.js"></script>

</body>

</html>
