<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Makes the page responsive on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Carousel Gallery</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="../IMAGE GALLERY/carousel.css">
</head>

<body>

    <!-- Page heading -->
    <header>
        <h1> 🌍 Planet Carousel</h1>
        <p>Watch the planets slide across the screen!</p>
    </header>


    <!-- Carousel -->
    <section class="carousel">

        <!-- Moving track -->
        <div class="carousel-track">

            <!-- Card 1 -->
            <div class="slide">
                <img src="../IMAGE GALLERY/assets/earth.jpeg" alt="Earth">
                <div class="info">
                    <h2>Earth</h2>
                    <p>Our Beautiful Home Planet.</p>
                </div>
            </div>


            <!-- Card 2 -->
            <div class="slide">
                <img src="../IMAGE GALLERY/assets/mars.jpg" alt="Mars">
                <div class="info">
                    <h2>Mars</h2>
                    <p>The Red Planet</p>
                </div>
            </div>


            <!-- Card 3 -->
            <div class="slide">
                <img src="../IMAGE GALLERY/assets/jupitar.jpeg" alt="Jupitar">
                <div class="info">
                    <h2>Jupitar</h2>
                    <p>The Largest Planet</p>
                </div>
            </div>


            <!-- Card 4 -->
            <div class="slide">
                <img src="../IMAGE GALLERY/assets/mercury.jpg" alt="Mercury">
                <div class="info">
                    <h2>Mercury</h2>
                    <p>The Smallest Planet</p>
                </div>
            </div>


            <!-- Card 5 -->
            <div class="slide">
                <img src="../IMAGE GALLERY/assets/venus.jpg" alt="Venus">
                <div class="info">
                    <h2>Venus</h2>
                    <p>The Hottest Planet</p>
                </div>
            </div>

        </div>

    </section>

</body>
</html>
